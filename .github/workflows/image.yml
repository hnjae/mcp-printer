name: Image
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Containerfile
      - .containerignore
      - package.json
      - bun.lock
      - src/**
      - .github/workflows/image.yml
jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="v$(jq -r .version package.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          load: true
          tags: mcp-printer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -o pipefail
          docker run -d --name smoke -p 127.0.0.1:3000:3000 mcp-printer:ci
          curl --silent --show-error --fail \
            --retry 15 --retry-delay 1 --retry-all-errors \
            --header 'content-type: application/json' \
            --header 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            http://127.0.0.1:3000/mcp \
            | jq -e '.result.tools | map(.name) | index("print_content")'
      - name: Show container logs on failure
        if: failure()
        run: docker logs smoke
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Publish image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
