name: npm
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for publish rights, so no token is stored
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag matches package.json
        run: |
          version="v$(jq -r .version package.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@11
      - name: Publish package
        env:
          TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: npm publish --tag "$TAG"
