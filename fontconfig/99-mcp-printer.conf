<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  SPDX-License-Identifier: AGPL-3.0-or-later
  SPDX-FileCopyrightText: 2026 KIM Hyunjae

  Chromium on Linux does not choose fonts for the CSS UI generic families. Map
  them to the fonts in this image so generic Markdown and HTML print
  consistently for Latin and CJK text.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-sans-serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="assign" binding="same"><string>Sarasa Mono K</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-rounded</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Sarasa Mono K</string></edit>
  </match>
</fontconfig>
